<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEP EASY</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    html, body {
      width: 100%;
      height: 100%;
    }
 
    body {
      background-color: #C1002B; /* Rouge drapeau de Hong Kong */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
    }
 
    .container {
      text-align: center;
      animation: fadeIn 1.4s ease forwards;
    }
 
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 12vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(
        105deg,
        #fff 0%,
        #fff 38%,
        #ffe9b0 44%,
        #ffffff 48%,
        #fffbe6 52%,
        #ffd97a 56%,
        #fff 62%,
        #fff 100%
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeIn 1.4s ease forwards, shine 3s linear infinite;
      filter: drop-shadow(0 0 18px rgba(255,220,100,0.35)) drop-shadow(0 2px 24px rgba(0,0,0,0.18));
    }
 
    @keyframes shine {
      0%   { background-position: 200% center; }
      100% { background-position: -50% center; }
    }
 
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STEP EASY</h1>
  </div>
</body>
</html>
